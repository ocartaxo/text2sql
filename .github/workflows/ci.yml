# .github/workflows/ci.yml
name: CI & Prompt Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Full eval suite diariamente às 06:00 UTC (03:00 BRT)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      eval_tier:
        description: "Tier de avaliação a executar"
        required: true
        default: "full"
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Prompt & Agent Changes
    runs-on: ubuntu-latest
    outputs:
      run_evals: ${{ steps.filter.outputs.agent_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agent_code:
              - 'src/text2sql/agent/**'
              - 'src/text2sql/guardrails/**'
              - 'src/text2sql/domain/policies.py'
              - 'evals/**'
              - 'docker/postgres/**'

  static-and-unit:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Ruff lint & format check
        run: |
          poetry run ruff check src tests evals
          poetry run ruff format --check src tests evals

      - name: Mypy static analysis
        run: poetry run mypy src

      - name: Run deterministic unit and contract tests
        run: poetry run pytest tests/unit tests/contract -v

  postgres-security:
    name: PostgreSQL RLS & Read-Only Integration
    runs-on: ubuntu-latest
    needs: static-and-unit
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password
          POSTGRES_DB: text2sql_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d text2sql_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      ADMIN_DATABASE_URL: postgresql://postgres:ci_admin_password@127.0.0.1:5432/text2sql_ci
      RO_DATABASE_URL: postgresql://text2sql_ro:change_me_in_prod_ro@127.0.0.1:5432/text2sql_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Bootstrap PostgreSQL schema, roles, RLS and CI seed
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/postgres/01_schema.sql
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/postgres/02_roles_and_rls.sql
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/postgres/03_seed_ci.sql

      - name: Run PostgreSQL security and RLS integration tests
        run: poetry run pytest tests/integration/test_postgres_security.py -v

  prompt-regression:
    name: LLM Prompt Regression (Execution Accuracy)
    runs-on: ubuntu-latest
    needs: [changes, postgres-security]
    # Roda em schedule/manual, em push na main ou em PRs que tocaram prompts/guardrails (exceto forks sem secrets)
    if: >-
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.run_evals == 'true') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.changes.outputs.run_evals == 'true'))
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password
          POSTGRES_DB: text2sql_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d text2sql_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      ADMIN_DATABASE_URL: postgresql://postgres:ci_admin_password@127.0.0.1:5432/text2sql_ci
      EVAL_DATABASE_URL: postgresql://text2sql_ro:change_me_in_prod_ro@127.0.0.1:5432/text2sql_ci
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EVAL_MODEL: google-gla:gemini-3.8-flash
      EVAL_MIN_ACCURACY: "0.85"
      EVAL_PACING_SECONDS: "2.0"
      EVAL_REPORT_PATH: eval-report.json
      EVAL_TIER: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.eval_tier ||
            (github.event_name == 'schedule' && 'full' || 'smoke') }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify LLM API secret is configured
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY não configurada nos Secrets do repositório."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Bootstrap PostgreSQL for evals
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/postgres/01_schema.sql
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/postgres/02_roles_and_rls.sql
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/postgres/03_seed_ci.sql

      - name: Run prompt regression suite
        run: poetry run pytest evals/test_regression.py -v -s

      - name: Upload eval report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ env.EVAL_TIER }}
          path: eval-report.json
          if-no-files-found: warn
